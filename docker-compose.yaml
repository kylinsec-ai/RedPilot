# ══════════════════════════════════════════════════════════
# Ghost 平台编排 — 统一服务器 + 求解 worker
# server = 控制面 + 观测平台统一服务(:8000)
# worker = 常驻 Pi Agent 求解容器(VPN 持有者),串行刷题
# legacy 模式仍可让 worker 经 BENCHMARK_BASE_URL 访问远端官方平台。
# ══════════════════════════════════════════════════════════

services:
  # ── 统一服务器:控制面 + 观测平台 ──
  server:
    build:
      context: .
      dockerfile: Dockerfile.ghost
    image: ghost-server:latest
    container_name: ghost-server
    restart: unless-stopped
    environment:
      # Control plane settings
      GHOST_TASKS_JSON: ${GHOST_TASKS_JSON:-}
      BENCHMARK_TOKEN: ${BENCHMARK_TOKEN:-}
      GHOST_ADMIN_TOKEN: ${GHOST_ADMIN_TOKEN:-}
      GHOST_WORKER_TOKEN: ${PLATFORM_WORKER_TOKEN:-}
      GHOST_PUBLIC_BASE_URL: ${GHOST_PUBLIC_BASE_URL:-http://server:8000}
      GHOST_PROVISIONER: ${GHOST_PROVISIONER:-static}
      GHOST_MAX_ACTIVE_CHALLENGES: ${GHOST_MAX_ACTIVE_CHALLENGES:-3}
      GHOST_DB_PATH: /app/data/ghost.sqlite3
      # Observability settings
      OBSERVABILITY_TOKEN: ${OBSERVABILITY_TOKEN:-}
      OBSERVABILITY_DB: /app/data/obs.sqlite3
      OBSERVABILITY_WEB: /app/web
      # Self-reference for canonical event outbox
      OBSERVABILITY_URL: ${OBSERVABILITY_URL:-http://localhost:8000}
    ports:
      # 统一端口 8000 提供所有 API (控制面 + 观测)
      # 宿主侧默认只绑回环;需要局域网访问时设置 SERVER_HOST_IP=0.0.0.0
      - target: 8000
        host_ip: ${SERVER_HOST_IP:-127.0.0.1}
        published: ${SERVER_PORT:-8000}
    volumes:
      - ./data:/app/data
      - ./web:/app/web:ro
      # 热补丁挂载(开发用):免重建镜像直接生效代码修改
      - ./packages/contracts:/opt/packages/contracts:ro
      - ./packages/ghost:/opt/packages/ghost:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghost-adapter:latest
    container_name: ghost-worker
    # restart 语义与 driver/entrypoint 退出码契约对齐:
    #   exit 0(任务完成/配置错误,driver 与 entrypoint 均以 0 明示)= 正常终止,不重启;
    #   exit 3(API 瞬断)/exit 4(VPN 层)= 自动拉起;其余非零(意外崩溃)= on-failure 自动拉起。
    #   注意:on-failure 会重启一切非零退出 —— 配置错误绝不能用 1/2 退出
    #   (unless-stopped 还会对 exit 0 无限重启,旧容器 25h 内 677 次循环的真因)
    restart: on-failure
    shm_size: 2gb
    stdin_open: true
    tty: true
    # ── Watchdog: driver 心跳超时自动重启 ──
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/driver_heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/driver_heartbeat) )) -lt ${WATCHDOG_MAX_IDLE_SECONDS:-300} ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    # ── VPN: 所有题目入口地址必须经 VPN 访问;唯一 worker 持有 tun ──
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # ── 平台凭据 (必填, 跑分任务下发) ──
      BENCHMARK_TOKEN: ${BENCHMARK_TOKEN:-}
      BENCHMARK_BASE_URL: ${BENCHMARK_BASE_URL:-}
      # assignment 模式:Worker 只领取 job,控制面地址与服务凭据独立于题目 token
      WORKER_MODE: ${WORKER_MODE:-legacy}
      PLATFORM_URL: ${PLATFORM_URL:-http://server:8000}
      PLATFORM_WORKER_TOKEN: ${PLATFORM_WORKER_TOKEN:-}
      ASSIGNMENT_LEASE_SECONDS: ${ASSIGNMENT_LEASE_SECONDS:-300}
      # ── LLM 凭据: pi 官方 provider env 名直通容器(仓库代码不读不改;
      #    pi 解析顺序: auth.json > env;默认 provider: deepseek;
      #    换 provider 在此加一行同名转发,env 名对照表见 README) ──
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      # ── 模型/会话 (SOLVER_MODEL 为完整 [provider/]model,缺省值见 adapter/config.py) ──
      SOLVER_MODEL: ${SOLVER_MODEL:-}
      SOLVER_SESSION_SECONDS: ${SOLVER_SESSION_SECONDS:-1500}
      PI_STALL_TIMEOUT: ${PI_STALL_TIMEOUT:-480}
      # ── 运行 ──
      ADAPTER_WORKDIR: /work
      ADAPTER_FLAG_FORMAT: ${ADAPTER_FLAG_FORMAT:-flag{...}}
      # 本地态势台 SPA 目录(挂载的 web 构建产物)
      OBSERVABILITY_WEB: /app/web
      # ── 人读态势台（只读 :8080；STATUS_PORT=0 禁用求解器内服务，
      #    但 0 不能出现在下方 ports 映射里（compose 校验直接失败，容器起不来），
      #    禁用时请一并注释掉整个 ports 段）──
      # STATUS_BIND 须为 0.0.0.0：docker-proxy 经容器全网卡地址转发；
      #    宿主侧暴露面由 ports 段的 host_ip 单独收口（默认回环）
      STATUS_PORT: ${STATUS_PORT:-8080}
      STATUS_BIND: ${STATUS_BIND:-0.0.0.0}
      WORKER_ID: ${WORKER_ID:-worker-1}
      # ── 观测平台摄取(可选):compose 网络内以 service DNS 可达;
      #    宿主直跑 driver 时设 OBSERVABILITY_URL=http://127.0.0.1:8000 ──
      OBSERVABILITY_URL: ${OBSERVABILITY_URL:-http://server:8000}
      OBSERVABILITY_TOKEN: ${OBSERVABILITY_TOKEN:-}
      # ── VPN 配置路径 (容器内, entrypoint 读取;文件不存在则跳过) ──
      ADAPTER_VPN_CONFIG: /vpn/client.ovpn
    ports:
      # 容器侧端口与 STATUS_PORT 保持一致(旧写法固定 8080,改 STATUS_PORT 会失联)。
      # 宿主侧默认只绑回环:态势台数据无鉴权且含实时 FLAG/完整实录,LAN 一律不可达;
      # 需要远程查看时显式放行 STATUS_HOST_IP=0.0.0.0(务必自评估暴露面)。
      # STATUS_PORT=0 禁用时仍须注释掉整个 ports 段(0 通不过 compose 校验)。
      - target: ${STATUS_PORT:-8080}
        host_ip: ${STATUS_HOST_IP:-127.0.0.1}
        published: ${STATUS_PORT:-8080}
    volumes:
      - ./work:/work
      - ./vpn:/vpn:ro
      # 可选: 自定义 pi 注册/凭据(models.json/auth.json,官方格式;镜像不再内置,按需启用)
      # - ./pi:/root/.pi/agent:ro
      # 挂载宿主最新包源(免重建镜像;editable 安装指向 /opt/packages/*,热补丁即生效)
      - ./packages/contracts:/opt/packages/contracts:ro
      - ./packages/ghost:/opt/packages/ghost:ro
      - ./packages/worker:/opt/packages/worker:ro
      - ./tools:/opt/tools:ro
      # pi skills 自动发现目录(~/.pi/agent/skills):改 skill 内容免重建镜像,下一题即生效
      - ./skills:/root/.pi/agent/skills:ro
      - ./web:/app/web:ro
    depends_on:
      server:
        condition: service_healthy

# worker 解题产物 bind-mount 到宿主机 ./work(不入库)

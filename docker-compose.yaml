# ══════════════════════════════════════════════════════════
# TsecBench 双服务编排 — 求解 worker + 本地观测平台(obs)
# worker = 常驻 Pi Agent 求解容器(VPN 持有者),串行刷题;
# platform = 观测平台:agent 日志入库(SQLite WAL) + 只读态势 API + SPA(:8090)。
# 远端官方跑分平台与本地 core 均不经由此编排(worker 经 BENCHMARK_BASE_URL 访问)。
# ══════════════════════════════════════════════════════════

services:
  # ── 本地观测平台:摄取(带 token)+ 查询/SSE/SPA 同源;零渗透工具/SDK/key 挂载 ──
  platform:
    build:
      context: .
      dockerfile: Dockerfile.platform
    image: tsecbench-platform:latest
    container_name: tsecbench-platform
    restart: unless-stopped
    environment:
      # 摄取鉴权 token;未配 → ingest 响亮 503(防静默空转);与 worker 中继同值
      OBSERVABILITY_TOKEN: ${OBSERVABILITY_TOKEN:-}
      OBSERVABILITY_DB: /app/data/obs.sqlite3
      OBSERVABILITY_WEB: /app/web
    ports:
      # 宿主侧端口由 OBS_PORT 控制;容器侧 = OBSERVABILITY_PORT(uvicorn CMD 同源读取)
      - "${OBS_PORT:-8090}:${OBSERVABILITY_PORT:-8090}"
    volumes:
      # data/ 首次有 compose 挂载:SQLite(+wal/shm)与 vpn/ 一样持久化在宿主机
      - ./data:/app/data
      - ./web:/app/web:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:${OBSERVABILITY_PORT:-8090}/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: tsecbench-adapter:latest
    container_name: tsecbench-worker
    # restart 语义与 driver/entrypoint 退出码契约对齐:
    #   exit 0(任务完成/配置错误,driver 与 entrypoint 均以 0 明示)= 正常终止,不重启;
    #   exit 3(API 瞬断)/exit 4(VPN 层)= 自动拉起;其余非零(意外崩溃)= on-failure 自动拉起。
    #   注意:on-failure 会重启一切非零退出 —— 配置错误绝不能用 1/2 退出
    #   (unless-stopped 还会对 exit 0 无限重启,旧容器 25h 内 677 次循环的真因)
    restart: on-failure
    shm_size: 2gb
    stdin_open: true
    tty: true
    # ── Watchdog: driver 心跳超时自动重启 ──
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/driver_heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/driver_heartbeat) )) -lt ${WATCHDOG_MAX_IDLE_SECONDS:-300} ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    # ── VPN: 所有题目入口地址必须经 VPN 访问;唯一 worker 持有 tun ──
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # ── 平台凭据 (必填, 跑分任务下发) ──
      BENCHMARK_TOKEN: ${BENCHMARK_TOKEN}
      BENCHMARK_BASE_URL: ${BENCHMARK_BASE_URL}
      # ── LLM 凭据: pi 官方 provider env 名直通容器(仓库代码不读不改;
      #    pi 解析顺序: auth.json > env;默认 provider: deepseek;
      #    换 provider 在此加一行同名转发,env 名对照表见 README) ──
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      # ── 模型/会话 (SOLVER_MODEL 为完整 [provider/]model,缺省值见 adapter/config.py) ──
      SOLVER_MODEL: ${SOLVER_MODEL:-}
      SOLVER_SESSION_SECONDS: ${SOLVER_SESSION_SECONDS:-1500}
      PI_STALL_TIMEOUT: ${PI_STALL_TIMEOUT:-480}
      # ── 运行 ──
      ADAPTER_WORKDIR: /work
      ADAPTER_FLAG_FORMAT: ${ADAPTER_FLAG_FORMAT:-flag{...}}
      # ── 人读态势台（只读 :8080；STATUS_PORT=0 禁用求解器内服务，
      #    但 0 不能出现在下方 ports 映射里（compose 校验直接失败，容器起不来），
      #    禁用时请一并注释掉整个 ports 段）──
      STATUS_PORT: ${STATUS_PORT:-8080}
      WORKER_ID: ${WORKER_ID:-worker-1}
      # ── 观测平台摄取(可选):compose 网络内以 service DNS 可达;
      #    宿主直跑 driver 时设 OBSERVABILITY_URL=http://127.0.0.1:8090 ──
      OBSERVABILITY_URL: ${OBSERVABILITY_URL:-http://platform:8090}
      OBSERVABILITY_TOKEN: ${OBSERVABILITY_TOKEN:-}
      # ── VPN 配置路径 (容器内, entrypoint 读取;文件不存在则跳过) ──
      ADAPTER_VPN_CONFIG: /vpn/client.ovpn
    ports:
      # 容器侧端口与 STATUS_PORT 保持一致(旧写法固定 8080,改 STATUS_PORT 会失联)
      - "${STATUS_PORT:-8080}:${STATUS_PORT:-8080}"
    volumes:
      - ./work:/work
      - ./vpn:/vpn:ro
      # 可选: 自定义 pi 注册/凭据(models.json/auth.json,官方格式;镜像不再内置,按需启用)
      # - ./pi:/root/.pi/agent:ro
      # 挂载宿主最新包源(免重建镜像;editable 安装指向 /opt/packages/*,热补丁即生效)
      - ./packages/contracts:/opt/packages/contracts:ro
      - ./packages/obs:/opt/packages/obs:ro
      - ./packages/worker:/opt/packages/worker:ro
      - ./tools:/opt/tools:ro
      # pi skills 自动发现目录(~/.pi/agent/skills):改 skill 内容免重建镜像,下一题即生效
      - ./skills:/root/.pi/agent/skills:ro
      - ./web:/app/web:ro

# worker 解题产物 bind-mount 到宿主机 ./work(不入库)

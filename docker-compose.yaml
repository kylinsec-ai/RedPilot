# ══════════════════════════════════════════════════════════════
# TsecBench 适配器 — 3-worker 编排
# 一个容器 = 一个 Pi Agent，一次只解一道题；3 个 worker 分片并行。
# VPN 服务端每用户限 1 连接：worker-1 负责连 VPN，
# worker-2/3 通过 network_mode: service:worker-1 共享其网络栈访问靶场。
# 新增 worker: 复制一个服务块，ADAPTER_WORKER_ID 递增，共享 worker-1 网络。
# ══════════════════════════════════════════════════════════════

x-worker-common: &worker-common
  build:
    context: .
    dockerfile: Dockerfile
  image: tsecbench-adapter:latest
  restart: unless-stopped
  shm_size: 2gb
  stdin_open: true
  tty: true
  # ── Watchdog: driver 心跳超时自动重启 ──
  healthcheck:
    test: ["CMD-SHELL", "test -f /tmp/driver_heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/driver_heartbeat) )) -lt ${WATCHDOG_MAX_IDLE_SECONDS:-300} ]"]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 300s
  volumes:
    - ./work:/work
    - ./vpn:/vpn:ro
    # 挂载宿主最新 driver/adapter（免重建镜像）
    - ./drivers:/app/drivers:ro
    - ./adapter:/app/adapter:ro

x-env: &env
  # ── 平台凭据 (必填，跑分任务下发) ──
  BENCHMARK_TOKEN: ${BENCHMARK_TOKEN}
  BENCHMARK_BASE_URL: ${BENCHMARK_BASE_URL}
  # ── 平台接入模式 (tsecbench-http / tsecbench-sdk / generic) ──
  ADAPTER_PLATFORM: ${ADAPTER_PLATFORM:-tsecbench-http}
  PLATFORM_SPEC_FILE: ${PLATFORM_SPEC_FILE:-}
  # ── 模型配置 ──
  SOLVER_API_KEY: ${SOLVER_API_KEY}
  ADAPTER_PROVIDER: ${ADAPTER_PROVIDER:-deepseek}
  SOLVER_GATEWAY: ${SOLVER_GATEWAY:-0}
  # ── 求解引擎: Pi Agent (固定) ──
  ADAPTER_SOLVER_MODEL: ${ADAPTER_SOLVER_MODEL:-}
  ADAPTER_SKILLS_DIR: ${ADAPTER_SKILLS_DIR:-}
  # ── 运行参数 ──
  ADAPTER_MAX_CONCURRENCY: ${ADAPTER_MAX_CONCURRENCY:-3}
  ADAPTER_TOTAL_SECONDS: ${ADAPTER_TOTAL_SECONDS:-21300}
  ADAPTER_WORKDIR: /work
  # ── Worker 水平扩展（一个容器 = 一个 Pi Agent，一次解一道题）──
  ADAPTER_WORKER_CONCURRENCY: ${ADAPTER_WORKER_CONCURRENCY:-1}
  # ── VPN 配置路径 ──
  ADAPTER_VPN_CONFIG: /vpn/client.ovpn

services:
  # ── worker-1: 唯一 VPN 持有者（NET_ADMIN + tun）──
  worker-1:
    <<: *worker-common
    container_name: tsecbench-worker-1
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      <<: *env
      ADAPTER_WORKER_ID: "0"
      ADAPTER_WORKER_COUNT: "3"

  # ── worker-2/3: 共享 worker-1 网络栈访问靶场（不连 VPN）──
  worker-2:
    <<: *worker-common
    container_name: tsecbench-worker-2
    network_mode: service:worker-1
    depends_on:
      worker-1:
        condition: service_healthy
    environment:
      <<: *env
      ADAPTER_WORKER_ID: "1"
      ADAPTER_WORKER_COUNT: "3"
      ADAPTER_VPN_CONFIG: ""

  worker-3:
    <<: *worker-common
    container_name: tsecbench-worker-3
    network_mode: service:worker-1
    depends_on:
      worker-1:
        condition: service_healthy
    environment:
      <<: *env
      ADAPTER_WORKER_ID: "2"
      ADAPTER_WORKER_COUNT: "3"
      ADAPTER_VPN_CONFIG: ""

# worker 工作目录已 bind-mount 到宿主机 ./work（Web 面板读取状态），无需命名卷
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-contracts"
version = "0.1.0"
description = "Ghost shared contracts: vocabulary, snapshot schema, redact/text/fsio, digest fold, paths, assets"
requires-python = ">=3.10"
# 有意零依赖:worker(Kali)与 obs(platform)两侧都可安全依赖的中立契约包。
# 任何第三方依赖都会破坏"平台不能 import worker 代码"问题的这一解法。
dependencies = []

[tool.setuptools.packages.find]
include = ["ghost_contracts*"]

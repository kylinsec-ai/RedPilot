[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redpilot-worker"
version = "0.1.0"
description = "RedPilot worker: arena orchestration (multi-session/timebox/stoploss), Pi-agent solver, obs relay, local dashboard"
requires-python = ">=3.10"
# deps: 官方 SDK(平台接入)+ httpx(观测中继)+ contracts + obs 基线(纯 stdlib localserver)。
# fastapi/pydantic 不再进 Kali 镜像(镜像瘦身为既定决策)。
dependencies = [
    "tsec-benchmark",
    "httpx",
    "redpilot-contracts",
    "redpilot",
]

[project.optional-dependencies]
dev = ["pyflakes"]

[project.scripts]
redpilot-worker = "redpilot_worker.driver:main"

[tool.setuptools.packages.find]
include = ["redpilot_worker*"]
